[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "espeak32-tools"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ble = ["bleak>=2.1"]

[project.scripts]
espeak32 = "espeak32.cli:main"

[tool.setuptools]
packages = ["espeak32"]

[tool.pytest.ini_options]
testpaths = ["tests"]
